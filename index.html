<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day!</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; }
        
        canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 5; 
            pointer-events: none; 
        }
        
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            color: white;
            font-size: 4em;
            font-weight: bold;
            text-shadow: 0 0 10px #ff69b4, 0 0 30px #ff69b4, 0 0 50px #ff1493;
            z-index: 10;
            visibility: hidden;
            pointer-events: none;
        }

        .mom-photo {
            position: absolute;
            width: 280px; 
            height: auto;
            border: 8px solid white;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.8);
            z-index: 1; 
            opacity: 0;
            /* This controls how slowly they appear */
            transition: opacity 3s ease-in-out; 
            pointer-events: none;
            border-radius: 4px;
        }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; justify-content: center;
            align-items: center; z-index: 100; color: white; flex-direction: column;
        }
        
        button {
            padding: 20px 40px; font-size: 1.5rem; cursor: pointer;
            background: #ff69b4; border: none; color: white; border-radius: 50px;
            box-shadow: 0 0 20px #ff69b4; font-weight: bold; transition: 0.3s;
        }
        button:hover { transform: scale(1.1); background: #ff1493; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="margin-bottom: 20px;">A Gift for the Best Mom ❤️</h1>
        <button onclick="startShow()">Open Your Surprise 🎁</button>
    </div>

    <!-- Music file -->
    <audio id="bgMusic" src="Music.mp3" loop></audio>

    <div id="message">Happy Mother's Day!</div>
    <canvas id="fireworksCanvas"></canvas>

    <!-- This links to your script.js -->
    <script src="script.js"></script>
</body>
</html>
